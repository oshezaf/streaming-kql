# IP, URL, bitwise, conversion, hash, math, datetime, array function batch
- name: ip_functions
  query: "source | extend N = parse_ipv4('1.2.3.4'), Priv = ipv4_is_private('10.0.0.1'), InR = ipv4_is_in_range('10.0.0.5', '10.0.0.0/24'), Cmp = ipv4_compare('1.2.3.4', '1.2.3.5')"
  input:  [{}]
  expect: [{N: 16909060, Priv: true, InR: true, Cmp: -1}]

- name: url_functions
  query: "source | extend P = parse_url('https://u:p@host.com:8080/a/b?x=1&y=2#frag')"
  input:  [{}]
  expect:
    - P:
        Scheme: "https"
        Host: "host.com"
        Port: "8080"
        Path: "/a/b"
        Username: "u"
        Password: "p"
        "Query Parameters": {x: "1", y: "2"}
        Fragment: "frag"

- name: url_encode_decode
  query: "source | extend E = url_encode_component('a b/c'), D = url_decode('a%20b')"
  input:  [{}]
  expect: [{E: "a%20b%2Fc", D: "a b"}]

- name: bitwise
  query: "source | extend A = binary_and(12, 10), O = binary_or(12, 10), X = binary_xor(12, 10), S = binary_shift_left(1, 4)"
  input:  [{}]
  expect: [{A: 8, O: 14, X: 6, S: 16}]

- name: conversion_and_hash
  query: "source | extend G = toguid('12345678-1234-1234-1234-123456789abc'), M = hash_md5('abc'), H1 = hash_sha1('abc')"
  input:  [{}]
  expect:
    - G: "12345678-1234-1234-1234-123456789abc"
      M: "900150983cd24fb0d6963f7d28e17f72"
      H1: "a9993e364706816aba3e25717850c26c9cd0d89d"

- name: math_and_gcd
  query: "source | extend D = degrees(3.141592653589793), G = gcd(12, 18), L = lcm(4, 6)"
  input:  [{}]
  expect: [{D: 180.0, G: 6, L: 12}]

- name: datetime_more
  query: "source | extend MK = format_datetime(make_datetime(2021, 3, 5, 9, 30, 0), 'yyyy-MM-dd HH:mm:ss'), EOM = format_datetime(endofmonth(todatetime('2021-02-10T00:00:00Z')), 'yyyy-MM-dd'), W = weekofyear(todatetime('2021-01-04T00:00:00Z')), U = format_datetime(unixtime_seconds_todatetime(0), 'yyyy-MM-dd')"
  input:  [{}]
  expect: [{MK: "2021-03-05 09:30:00", EOM: "2021-02-28", W: 1, U: "1970-01-01"}]

- name: datetime_add
  query: "source | extend A = format_datetime(datetime_add('month', 2, todatetime('2021-01-15T00:00:00Z')), 'yyyy-MM-dd'), B = format_datetime(datetime_add('day', 10, todatetime('2021-01-15T00:00:00Z')), 'yyyy-MM-dd')"
  input:  [{}]
  expect: [{A: "2021-03-15", B: "2021-01-25"}]

- name: array_more
  query: "source | extend S = array_sort_asc(arr), R = array_reverse(arr), Sum = array_sum(arr), Rot = array_rotate_left(arr, 1)"
  input:  [{arr: [3, 1, 2]}]
  expect: [{arr: [3, 1, 2], S: [1, 2, 3], R: [2, 1, 3], Sum: 6, Rot: [1, 2, 3]}]

- name: bag_functions
  query: "source | extend M = bag_merge(a, b), K = bag_remove_keys(a, keys)"
  input:  [{a: {x: 1, y: 2}, b: {y: 9, z: 3}, keys: [y]}]
  expect: [{a: {x: 1, y: 2}, b: {y: 9, z: 3}, keys: [y], M: {x: 1, y: 2, z: 3}, K: {x: 1}}]

- name: string_more
  query: "source | extend C = strcmp('a', 'b'), T = translate('ab', 'AB', s), I = indexof_regex(s, '[0-9]+')"
  input:  [{s: "ab12"}]
  expect: [{s: "ab12", C: -1, T: "AB12", I: 2}]

- name: parse_cef
  query: "source | extend D = parse_cef_dictionary(msg)"
  input:  [{msg: "CEF:0|Vendor|Product|1.0|100|Some Event|5|src=1.2.3.4 dst=5.6.7.8"}]
  expect:
    - msg: "CEF:0|Vendor|Product|1.0|100|Some Event|5|src=1.2.3.4 dst=5.6.7.8"
      D:
        Version: "0"
        DeviceVendor: "Vendor"
        DeviceProduct: "Product"
        DeviceVersion: "1.0"
        SignatureId: "100"
        Name: "Some Event"
        Severity: "5"
        Extension: {src: "1.2.3.4", dst: "5.6.7.8"}

- name: evaluate_bag_unpack
  query: "source | evaluate bag_unpack(ctx)"
  input:  [{id: 1, ctx: {level: 2, device: "apollo"}}]
  expect: [{id: 1, level: 2, device: "apollo"}]

- name: evaluate_bag_unpack_prefix
  query: "source | evaluate bag_unpack(ctx, 'ctx_')"
  input:  [{id: 1, ctx: {level: 2}}]
  expect: [{id: 1, ctx_level: 2}]
