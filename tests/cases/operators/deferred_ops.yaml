# Operators that were previously deferred and are now implemented over the
# per-record row-set: sample, sample-distinct, serialize (+ window functions),
# mv-apply, make-series.

# --- sample ------------------------------------------------------------------
- name: sample_returns_all_when_n_ge_count
  query: "source | mv-expand v = V | sample 10 | project v"
  input:  [{V: [1, 2, 3]}]
  expect:
    - {v: 1}
    - {v: 2}
    - {v: 3}

- name: sample_count_is_n
  query: "source | mv-expand v = V | sample 2 | count"
  options: {random_seed: 7}
  input:  [{V: [10, 20, 30, 40]}]
  expect: [{Count: 2}]

- name: sample_seeded_is_deterministic
  query: "source | mv-expand v = V | sample 2 | project v"
  options: {random_seed: 7}
  input:  [{V: [10, 20, 30, 40]}]
  expect:
    - {v: 10}
    - {v: 30}

# --- sample-distinct ---------------------------------------------------------
- name: sample_distinct_all
  query: "source | mv-expand v = V | sample-distinct 10 of v"
  input:  [{V: [1, 1, 2, 3, 3]}]
  expect:
    - {v: 1}
    - {v: 2}
    - {v: 3}

- name: sample_distinct_seeded
  query: "source | mv-expand v = V | sample-distinct 2 of v"
  options: {random_seed: 7}
  input:  [{V: [1, 2, 3, 4, 5]}]
  expect:
    - {v: 2}
    - {v: 3}

# --- serialize + window functions --------------------------------------------
- name: serialize_row_number_and_prev
  query: "source | mv-expand v = V | sort by v asc | serialize rn = row_number(), d = v - prev(v, 1, 0)"
  input:  [{V: [30, 10, 20]}]
  expect:
    - {V: [30, 10, 20], v: 10, rn: 1, d: 10}
    - {V: [30, 10, 20], v: 20, rn: 2, d: 10}
    - {V: [30, 10, 20], v: 30, rn: 3, d: 10}

- name: serialize_row_number_from_zero
  query: "source | mv-expand v = V | serialize i = row_number(0) | project i"
  input:  [{V: [5, 6, 7]}]
  expect:
    - {i: 0}
    - {i: 1}
    - {i: 2}

- name: serialize_next
  query: "source | mv-expand v = V | serialize nx = next(v) | project v, nx"
  input:  [{V: [1, 2, 3]}]
  expect:
    - {v: 1, nx: 2}
    - {v: 2, nx: 3}
    - {v: 3, nx: null}

- name: serialize_row_cumsum
  query: "source | mv-expand v = V | serialize c = row_cumsum(v) | project c"
  input:  [{V: [1, 2, 3, 4]}]
  expect:
    - {c: 1}
    - {c: 3}
    - {c: 6}
    - {c: 10}

- name: serialize_identity
  query: "source | mv-expand v = V | serialize | project v"
  input:  [{V: [1, 2]}]
  expect:
    - {v: 1}
    - {v: 2}

# --- mv-apply ----------------------------------------------------------------
- name: mvapply_summarize
  query: "source | mv-apply x = Arr on (summarize s = sum(x), mx = max(x))"
  input:  [{id: 1, Arr: [3, 1, 4, 1, 5]}]
  expect:
    - {id: 1, s: 14, mx: 5}

- name: mvapply_filter_top
  query: "source | mv-apply x = Arr on (where x > 2 | top 2 by x)"
  input:  [{id: 1, Arr: [5, 1, 3, 4, 2]}]
  expect:
    - {id: 1, x: 5}
    - {id: 1, x: 4}

- name: mvapply_bare_column
  query: "source | mv-apply Arr on (summarize m = max(Arr))"
  input:  [{id: 7, Arr: [10, 40, 20]}]
  expect:
    - {id: 7, m: 40}

- name: mvapply_multi_column_lockstep
  query: "source | mv-apply a = A, b = B on (extend p = a * b)"
  input:  [{A: [1, 2], B: [10, 20]}]
  expect:
    - {a: 1, b: 10, p: 10}
    - {a: 2, b: 20, p: 40}

# --- make-series -------------------------------------------------------------
- name: make_series_grouped_with_default
  query: "source | mv-expand e = Events | extend t = toint(e.t), val = toint(e.v), g = tostring(e.g) | make-series total = sum(val) default = 0 on t from 0 to 4 step 1 by g"
  input:
    - Events:
        - {g: "a", t: 0, v: 10}
        - {g: "a", t: 2, v: 5}
        - {g: "b", t: 1, v: 7}
  expect:
    - {g: "a", t: [0, 1, 2, 3], total: [10, 0, 5, 0]}
    - {g: "b", t: [0, 1, 2, 3], total: [0, 7, 0, 0]}

- name: make_series_no_by
  query: "source | mv-expand v = V | make-series c = count() on v from 0 to 5 step 1"
  input:  [{V: [0, 0, 2, 4]}]
  expect:
    - {v: [0, 1, 2, 3, 4], c: [2, 0, 1, 0, 1]}

- name: make_series_inferred_bounds
  query: "source | mv-expand v = V | make-series c = count() on v step 1"
  input:  [{V: [2, 2, 4, 5]}]
  expect:
    - {v: [2, 3, 4, 5], c: [2, 0, 1, 1]}

- name: make_series_from_only
  query: "source | mv-expand v = V | make-series c = count() on v from 0 step 1"
  input:  [{V: [1, 3]}]
  expect:
    - {v: [0, 1, 2, 3], c: [0, 1, 0, 1]}

- name: make_series_to_only
  query: "source | mv-expand v = V | make-series c = count() on v to 5 step 1"
  input:  [{V: [1, 3]}]
  expect:
    - {v: [1, 2, 3, 4], c: [1, 0, 1, 0]}

- name: make_series_inferred_no_axis_values
  query: "source | mv-expand x = X | make-series c = count() on missing step 1"
  input:  [{X: [1, 2, 3]}]
  expect: []

