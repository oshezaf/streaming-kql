# dynamic data handling (parse_json + property access) and unsupported rejection
- name: parse_json_and_access
  query: "source | extend ctx = parse_json(AdditionalContext) | extend Level = toint(ctx.Level) | project Level, Device = tostring(ctx.DeviceID)"
  schema: {Message: string, AdditionalContext: dynamic}
  input:
    - {Message: "hi", AdditionalContext: '{"Level": 2, "DeviceID": "apollo13"}'}
  expect:
    - {Level: 2, Device: "apollo13"}

- name: make_series_is_deferred
  query: "source | make-series Count = count() on T step 1h"
  expect_error: KqlUnsupportedError

- name: scan_is_deferred
  query: "source | scan with () declare"
  expect_error: KqlUnsupportedError

- name: mv_expand_assignment_form
  query: "source | mv-expand Tag = Tags"
  input:  [{Id: 1, Tags: ["a", "b"]}]
  expect:
    - {Id: 1, Tags: ["a", "b"], Tag: "a"}
    - {Id: 1, Tags: ["a", "b"], Tag: "b"}

- name: unknown_operator
  query: "source | frobnicate X"
  expect_error: KqlCompileError
